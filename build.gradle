plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}


java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}


task copyHtml(type: Copy) {
    from 'src/main/html'
    into 'build/reports'
}

task copyDocs(type: Copy) {
    dependsOn javadoc
    from 'build/docs'
    into 'build/reports'
}

task reports {
    dependsOn build, copyHtml, copyDocs
    description = 'Gathers HTML content and javadocs into build/reports.'
}

task deployReports(type: Exec) {
    dependsOn reports
    description = 'Pushes build/reports to the gh-pages branch cleanly.'
    
    commandLine 'sh', '-c', '''
        git config user.name >/dev/null 2>&1 || git config user.name "Gradle Build"
        git config user.email >/dev/null 2>&1 || git config user.email "gradle@build.local"
        
        # Temporarily stage and commit the ignored build/reports folder
        git add -f build/reports
        git commit -m "Temporary deployment commit" || true
        
        # Push the build/reports subdirectory to the gh-pages branch
        git subtree push --prefix build/reports origin gh-pages
        
        # Undo the temporary commit on main so your local repository remains clean
        git reset HEAD~1
    '''
}


application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}

