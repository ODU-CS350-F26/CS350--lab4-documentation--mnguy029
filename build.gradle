plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}


java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}


task copyHtml(type: Copy) {
    from 'src/main/html'
    into 'build/reports'
}

task copyDocs(type: Copy) {
    dependsOn javadoc
    from 'build/docs'
    into 'build/reports'
}

task reports {
    dependsOn build, copyHtml, copyDocs
    description = 'Gathers HTML content and javadocs into build/reports.'
}

task deployReports(type: Exec) {
    dependsOn reports
    description = 'Builds reports and force-pushes build/reports to the gh-pages branch.'
    
    commandLine 'sh', '-c', 'git add -f build/reports && \
                           git commit -m "Update reports for deployment" || true && \
                           git subtree push --prefix build/reports origin gh-pages'
}


application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}

