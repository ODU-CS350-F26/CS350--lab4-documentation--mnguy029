plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}


java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

gitPublishCopy.dependsOn reports

gitPublish {
    // Your repository clone URL
    repoUri = 'https://github.com/odu-cs350-f26/CS350--lab4-documentation--mnguy029.git'

    // Branch in which to publish
    branch = 'gh-pages'
  
    // What to publish (your generated reports directory)
    contents {
        from 'build/reports'
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}


task copyHtml(type: Copy) {
    from 'src/main/html'
    into 'build/reports'
}

task copyDocs(type: Copy) {
    dependsOn javadoc
    from 'build/docs'
    into 'build/reports'
}

task reports {
    dependsOn build, copyHtml, copyDocs
    description = 'Gathers HTML content and javadocs into build/reports.'
}



task deployReports {
    dependsOn gitPublishPush
    group = 'Reporting'
    description = 'Builds and pushes the reports directory to GitHub Pages'
}


application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}

